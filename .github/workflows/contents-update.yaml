name: Contents Update

on:
  schedule:
    - cron: 0 0 * * 6
  workflow_dispatch:
    

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '24'

jobs:
  article:
    name: Article
    runs-on: ubuntu-latest
    env:
      BRANCH: cron/update-article
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout -B ${{ env.BRANCH }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Update article
        id: update
        run: |
          {
            echo "stdout<<EOF"
            pnpm run -s gen:article
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - name: Check diff
        id: diff
        run: git diff origin/${{ github.ref_name }} --exit-code
        continue-on-error: true
      - name: Create PR
        run: |
          pnpm run gen:webp
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "article update"
          git push -f origin ${{ env.BRANCH }}
          gh pr close ${{ env.BRANCH }} || true
          gh pr create -B ${{ github.ref_name }} -t "CRON:記事情報更新" -b "${{ steps.update.outputs.stdout }}"
        if: steps.diff.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
  presentation:
    name: Presentation
    runs-on: ubuntu-latest
    env:
      BRANCH: cron/update-presentation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout -B ${{ env.BRANCH }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Update presentation
        id: update
        run: |
          {
            echo "stdout<<EOF"
            pnpm run -s gen:presentation
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - name: Check diff
        id: diff
        run: git diff origin/${{ github.ref_name }} --exit-code
        continue-on-error: true
      - name: Create PR
        run: |
          pnpm run gen:webp
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "presentation update"
          git push -f origin ${{ env.BRANCH }}
          gh pr close ${{ env.BRANCH }} || true
          gh pr create -B ${{ github.ref_name }} -t "CRON:プレゼン情報更新" -b "${{ steps.update.outputs.stdout }}"
        if: steps.diff.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
